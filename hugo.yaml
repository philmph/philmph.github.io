### Autogenerated by quickstart
baseURL: https://pmaier.at/
languageCode: en-us
title: YATB

### Hugo configuration below following https://gohugo.io/configuration/all

# Based on https://gohugo.io/host-and-deploy/host-on-github-pages/
caches:
  images:
    dir: :cacheDir/images

copyright: "© 2025 by Philipp Maier"
enableEmoji: true

# Overwrite the default
mainsections:
  - posts

menus:
  main:
    - identifier: home
      name: Home
      weight: 1
      pageRef: /

    - identifier: search
      name: Search
      weight: 2
      pageRef: search/

    - identifier: tags
      name: Tags
      weight: 3
      pageRef: tags/

    - identifier: archive
      name: Archive
      weight: 4
      pageRef: archive/

# To keep RSS pretty-printed
minify:
  disableXML: true

# Added json based on https://github.com/adityatelange/hugo-PaperMod/wiki/Features#search-page
outputs:
  home:
    - html
    - rss
    - json

# Show 5 posts instead of 10 (default)
pagination:
  pagerSize: 5

### PaperMod configuration below
theme: PaperMod

params:
  # Enable Home-Info Mode
  # https://adityatelange.github.io/hugo-PaperMod/posts/papermod/papermod-features/#home-info-mode
  homeInfoParams:
    Title: 🐧 Yet Another Tech Blog
    Content: Hi, I'm Philipp. I'll post nerd stuff here.

  socialIcons:
    - name: "github"
      url: "https://github.com/philmph"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/philipp-maier-801b54138"
    - name: "kofi"
      url: "https://ko-fi.com/philmph"
    # ??? I no longer use XING
    # - name: "xing"
    #   url: "https://www.xing.com/profile/Philipp_Maier63/cv"

  # Regular configuration options sorted per docs
  # https://adityatelange.github.io/hugo-PaperMod/posts/papermod/papermod-variables/
  ShowReadingTime: true
  ShowShareButtons: true
  ShowCodeCopyButtons: true
  defaultTheme: auto
  ShowToc: true
  ShareButtons:
    - linkedin
    - reddit
    - whatsapp
    - telegram
  ShowRssButtonInSectionTermList: true
